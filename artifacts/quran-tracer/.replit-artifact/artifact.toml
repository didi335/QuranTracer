kind = "web"
previewPath = "/"
title = "Quran Tracer"
version = "1.0.0"
id = "artifacts/quran-tracer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19780

[services.development]
run = "pnpm --filter @workspace/quran-tracer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quran-tracer", "run", "build" ]
publicDir = "artifacts/quran-tracer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19780"
BASE_PATH = "/"
